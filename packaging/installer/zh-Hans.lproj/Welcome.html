<img src="AppIcon.png" alt="充电上限">
<h1>充电上限</h1>
<p>让电池少受累。智能模式平时停在 80%，记住你平时几点拔电源，拔之前自动充满。</p>
<ul>
<li>智能：记住你的拔电时间，离电前备电。</li>
<li>固定：按你排的时间段设上限。</li>
<li>一直充满：适合台式机。</li>
</ul>
<p>设置充电上限不需要密码。放电帮手是可选的，安装时系统会问一次管理员密码。</p>
