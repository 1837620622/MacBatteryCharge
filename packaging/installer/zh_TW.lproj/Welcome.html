body { font-family: -apple-system, "PingFang TC", sans-serif; color: #1d1d1f; margin: 0 6px; }

<body>
<img src="background.png" width="64" height="64" alt="充電上限">
<h1>充電上限</h1>
<p>讓電池少受累。智慧模式平時停在 80%，記住你平時幾點拔電源，拔之前自動充滿。</p>
<ul>
<li>智慧：記住你的拔電時間，離電前備電。</li>
<li>固定：依你排的時間段設上限。</li>
<li>一直充滿：適合桌上型電腦。</li>
</ul>
<p>設定充電上限不需要密碼。放電幫手是選用的，安裝時系統會問一次管理員密碼。</p>
</body></html>
