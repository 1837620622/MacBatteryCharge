name: Build macOS packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test and package arm64 and Intel
        run: bash packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MacBatteryCharge
          path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file packaging/release-notes.md
          fi
