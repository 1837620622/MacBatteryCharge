name: Build macOS packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test and package arm64 and Intel
        run: bash packaging/build.sh

      # 更新签名：用 GitHub Secret UPDATE_SIGNING_KEY（私钥的 base64）给每个安装包签一个 .sig。
      # 没设置就跳过（PR 或还没配密钥时）；发版那一步会检查，缺签名就不发。
      - name: Sign update packages
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "没有设置 UPDATE_SIGNING_KEY：这次不签名。发版前必须设置。"
            exit 0
          fi
          for pkg in dist/*.pkg; do
            printf '%s' "$UPDATE_SIGNING_KEY" | swift packaging/sign-update.swift "$pkg" > "$pkg.sig"
            echo "已签名 $(basename "$pkg")"
          done

      - name: Idle CPU and memory
        run: |
          set -euo pipefail
          app="build/arm64/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          [[ "$(uname -m)" == arm64 ]] || app="build/intel/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          "$app" --background &
          pid=$!
          sleep 45
          kill -0 "$pid"
          read -r cpu rss < <(ps -o %cpu=,rss= -p "$pid")
          echo "空闲 45 秒：CPU ${cpu}%（含启动），内存 $((rss / 1024)) MB"
          kill "$pid"
          awk -v c="$cpu" 'BEGIN { exit (c > 4.0) }' || { echo "空闲 CPU 超过预算 4%"; exit 1; }
          [[ $((rss / 1024)) -le 150 ]] || { echo "内存超过预算 150 MB"; exit 1; }

      - name: Window open CPU
        run: |
          set -euo pipefail
          app="build/arm64/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          [[ "$(uname -m)" == arm64 ]] || app="build/intel/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          "$app" --bench-live

      - name: Snapshots
        continue-on-error: true
        run: |
          set -euo pipefail
          app="build/$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo intel )/MacBatteryCharge.app"
          "$app/Contents/MacOS/MacBatteryCharge" --snapshot "$PWD/snapshots"
          ls -l snapshots

      # 自检：在真机器上走真实的代码路径，结果写进 snapshots 产物里。失败只标红，不挡住打包。
      - name: Self-test menu bar click
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p snapshots
          app="build/$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo intel )/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          "$app" --selftest-menubar "$PWD/snapshots/selftest-menubar.txt" &
          pid=$!
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "菜单栏自检超过 60 秒，没有结束"; fi
          wait "$pid" || true
          cat snapshots/selftest-menubar.txt || echo "没有生成菜单栏自检报告"

      - name: Self-test update (verify signature, install, check version)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p snapshots
          arch=$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo intel )
          app="build/$arch/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          version="$(tr -d '[:space:]' < VERSION)"
          status=0
          "$app" --selftest-update "$PWD/snapshots/selftest-update.txt" --pkg "$PWD/dist/MacBatteryCharge-$version-$arch.pkg" --expect "$version" || status=$?
          cat snapshots/selftest-update.txt || echo "没有生成更新自检报告"
          exit "$status"

      # 原地更新：在临时文件夹里模拟「应用程序」，用刚打好的安装包换一次，核对换上去的版本、备份和签名。
      - name: Self-test in-place update (sandbox copy of Applications)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p snapshots
          arch=$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo intel )
          app="build/$arch/MacBatteryCharge.app/Contents/MacOS/MacBatteryCharge"
          version="$(tr -d '[:space:]' < VERSION)"
          status=0
          "$app" --selftest-inplace "$PWD/snapshots/selftest-inplace.txt" --pkg "$PWD/dist/MacBatteryCharge-$version-$arch.pkg" --expect "$version" || status=$?
          cat snapshots/selftest-inplace.txt || echo "没有生成原地更新自检报告"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MacBatteryCharge
          path: dist/*

      # 同一个版本号只发一次。VERSION 没改就推 main（比如修文档、改 CI），
      # 不再悄悄替换已经发出去的安装包：同版本号的两份二进制对用户和校验都没法分辨。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 不是三段版本号：$VERSION"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION 已经发布过，跳过。要发新包请先改 VERSION。"
            exit 0
          fi
          for pkg in dist/*.pkg; do
            [[ -f "$pkg.sig" ]] || { echo "缺少签名：$pkg。先设置 UPDATE_SIGNING_KEY 再发版。"; exit 1; }
          done
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file packaging/release-notes.md
