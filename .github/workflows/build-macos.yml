name: Build macOS packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test and package arm64 and Intel
        run: bash packaging/build.sh

      - name: Snapshots
        continue-on-error: true
        run: |
          set -euo pipefail
          app="build/$( [[ "$(uname -m)" == arm64 ]] && echo arm64 || echo intel )/MacBatteryCharge.app"
          "$app/Contents/MacOS/MacBatteryCharge" --snapshot "$PWD/snapshots"
          ls -l snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MacBatteryCharge
          path: dist/*

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file packaging/release-notes.md
          fi
